services:
  - type: web
    name: flask-v3-volt
    plan: starter
    env: python
    region: frankfurt  # region should be same as your database region.
    buildCommand: "./build.sh"
    startCommand: "gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: SESSION_COOKIE_SECURE
        value: 'True'  # Render sert l'app en HTTPS ; à laisser à False en local (http://)
      # Mots de passe des 4 comptes de démonstration insérés par la première
      # migration (voir migrations/versions/276120d6d4b9_*.py) : générés
      # aléatoirement ici pour ne PAS utiliser les valeurs par défaut de dev
      # local, déjà documentées dans l'historique public du dépôt.
      - key: SEED_PWD_J_DUPONT
        generateValue: true
      - key: SEED_PWD_M_KOUAM
        generateValue: true
      - key: SEED_PWD_P_MEKA
        generateValue: true
      - key: SEED_PWD_S_NKOLO
        generateValue: true
      # E-mails d'alerte de stock (voir README, section « Alertes de stock
      # par e-mail »). Laisser SMTP_HOST vide désactive l'envoi : les
      # alertes sont alors seulement journalisées. À renseigner pour un
      # envoi réel :
      # - key: SMTP_HOST
      #   value: smtp.exemple.fr
      # - key: SMTP_PORT
      #   value: '587'
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: ALERTE_EMAIL_EXPEDITEUR
      #   value: alertes-stock@gtc.example
      # - key: ALERTE_EMAIL_DEFAUT
      #   value: stock@gtc.example
