<!--
  GTC Stock — Layout des pages d'AUTHENTIFICATION (écran fractionné navy).
  Design porté depuis la maquette statique gtc_stock_pro/.

  Minimal : le head (mêmes assets locaux que gtc-base) + <body class="auth-body">
  dont le seul contenu est le bloc `content` (les pages sign-in / sign-up
  dessinent elles-mêmes l'illustration à gauche et le formulaire à droite).
  Blocs surchargeables : title, content, extrastyle, extra_js.
-->
{#
  Nota : `layouts/base.html` (Volt) est un autre layout, non utilisé ici —
  voir DOCS/PARCOURS_DU_CODE.md §7.4.
#}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GTC Stock{% endblock title %}</title>

  <link href="{{ url_for('static', filename='vendor/bootstrap/dist/css/bootstrap.min.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/font/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gtc-stock.css') }}">
  {% block extrastyle %}{% endblock extrastyle %}
</head>
<body class="auth-body">

{% block content %}{% endblock content %}

<script src="{{ url_for('static', filename='vendor/bootstrap/dist/js/bootstrap.min.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/gtc-stock.js') }}"></script>
{% block extra_js %}{% endblock extra_js %}
</body>
</html>
