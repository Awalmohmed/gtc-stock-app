version: '3.8'
services:
  appseed-app:
    container_name: appseed_app
    restart: always
    build: .
    environment:
      # Fichier SQLite stocké dans le volume nommé ci-dessous, pour
      # survivre aux rebuilds/redémarrages du conteneur — sans ça,
      # `docker-compose up --build` efface toute la base à chaque fois.
      - DATABASE_URL=sqlite:////data/gtc_stock.sqlite3
      # SECRET_KEY et SESSION_COOKIE_SECURE : à définir via un fichier
      # .env à la racine pour un déploiement réel (voir README) — les
      # valeurs par défaut ci-dessous conviennent seulement en local.
      - SECRET_KEY=${SECRET_KEY:-S#perS3crEt_9999}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-False}
    volumes:
      - gtc_stock_data:/data
    networks:
      - db_network
      - web_network
  nginx:
    container_name: nginx
    restart: always
    image: "nginx:latest"
    ports:
      - "5085:5085"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - web_network
    depends_on: 
      - appseed-app
networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge

volumes:
  gtc_stock_data: